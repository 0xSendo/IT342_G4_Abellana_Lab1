name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Backend + Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Backend tests (JUnit + MockMvc)
        run: npm run test:backend

      - name: Install frontend dependencies
        working-directory: Web
        run: npm ci

      - name: Frontend unit tests (Vitest)
        working-directory: Web
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: Web
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E tests (Playwright)
        working-directory: Web
        env:
          VITE_FIREBASE_API_KEY: AIzaSyB0000000000000000000000000000000
          VITE_FIREBASE_AUTH_DOMAIN: internmatch-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: internmatch-ci
          VITE_FIREBASE_STORAGE_BUCKET: internmatch-ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
          VITE_FIREBASE_MEASUREMENT_ID: G-CIPROBEXXXX
        run: npm run test:frontend

      - name: Generate Allure report
        run: npm run report:generate

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report