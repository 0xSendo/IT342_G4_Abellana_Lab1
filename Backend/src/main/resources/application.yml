spring:
  application:
    name: internmatch
 
  datasource:
    # Default to an in-memory H2 database for local development when DB_URL is not provided.
    url: ${DB_URL:jdbc:h2:mem:internmatch;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
 
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
 
server:
  port: ${PORT:${SERVER_PORT:8081}}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
 
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    org.springframework: ${LOGGING_LEVEL_SPRING:INFO}
    org.hibernate: ${LOGGING_LEVEL_HIBERNATE:WARN}
 
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  oauth2:
    frontend-redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth-callback}